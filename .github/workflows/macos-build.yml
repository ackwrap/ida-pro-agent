name: macOS Universal 2 package

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: macos-package
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  package:
    name: Full macOS Universal 2 ZIP and DMG
    if: github.repository == 'ackwrap/ida-pro-agent' && !github.event.repository.private && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache-dependency-path: ida-mcp/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Check build prerequisites
        run: |
          for tool in cmake ninja; do command -v "$tool" || brew install "$tool"; done
          for tool in cmake ninja go python3 openssl; do command -v "$tool"; done
          xcrun --find clang
          xcrun --find swiftc
          go version
          sw_vers -productVersion
      - name: Cache public Qt link inputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/qt-public
          key: qt-public-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('release/build_qt.py', 'ida-agent-plugin/cmake/qt_link_inputs.py', 'ida-agent-plugin/cmake/validate_ida_qt_*.py') }}
      - name: Build or validate public Qt link inputs
        run: python3 release/build_qt.py --prefix build/qt-public
      - name: Prepare Python test dependencies
        run: |
          python3 -m venv build/macos-venv
          build/macos-venv/bin/python -m pip install websockets==15.0.1
      - name: Validate, compile and package both architectures
        env:
          IDASDK: ${{ github.workspace }}/ida-sdk/src
        run: |
          build/macos-venv/bin/python release/build_macos.py \
            --qt-prefix build/qt-public \
            --python build/macos-venv/bin/python
      - name: Verify release Gateway compatibility
        run: |
          python3 mcp-test-project/verify_stdio.py build/release/macos/ida-mcp-universal
          python3 mcp-test-project/verify_compatibility.py build/release/macos/ida-mcp-universal --http
      - name: Include release notes
        run: |
          version=$(cat ida-mcp/VERSION)
          cp "release/notes/$version.md" "release/dist/ida-agent-$version-release-notes.md"
          cat "release/notes/$version.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload tested release packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ida-agent-macos-universal2-${{ github.sha }}
          path: |
            release/dist/ida-agent-*-macos-universal2.zip
            release/dist/ida-agent-*-macos-universal2.zip.sha256
            release/dist/ida-agent-*-macos-universal2.dmg
            release/dist/ida-agent-*-macos-universal2.dmg.sha256
            release/dist/ida-agent-*-release-notes.md
          if-no-files-found: error
          retention-days: 30
      - name: Upload CTest results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ida-agent-macos-tests-${{ github.sha }}
          path: build/release/macos/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14
