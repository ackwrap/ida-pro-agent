name: Sync public source

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: public-source-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'ackwrap/ida-pro-agent' && !github.event.repository.private && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Check source-read configuration
        id: credentials
        env:
          SOURCE_READ_TOKEN: ${{ secrets.IDA_AGENT_SOURCE_READ_TOKEN }}
        run: |
          if [ -n "$SOURCE_READ_TOKEN" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Source sync awaits IDA_AGENT_SOURCE_READ_TOKEN (Contents: read on ackwrap/ida-agent).' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Read latest private source
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ackwrap/ida-agent
          ref: master
          token: ${{ secrets.IDA_AGENT_SOURCE_READ_TOKEN }}
          path: build/source-storage
          submodules: false
          persist-credentials: false
      - name: Test synchronization and publishing
        if: steps.credentials.outputs.configured == 'true'
        run: python -m unittest discover -s release/tests -p 'test_*.py'
      - name: Synchronize source and dispatch public checks and releases
        if: steps.credentials.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_READ_TOKEN: ${{ secrets.IDA_AGENT_SOURCE_READ_TOKEN }}
        run: python release/sync_public_automation.py --source build/source-storage
