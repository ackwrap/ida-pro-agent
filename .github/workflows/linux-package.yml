name: Linux x64 package

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Full Linux x64 AI package
    if: github.repository == 'ackwrap/ida-pro-agent' && !github.event.repository.private && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache-dependency-path: ida-mcp/go.sum
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev ca-certificates openssl python3-websockets binutils \
            libgl-dev libegl1 libopengl0 libfontconfig1 libxkbcommon0 libdbus-1-3 librsvg2-bin desktop-file-utils appstream
      - name: Cache public Qt link inputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/qt-public
          key: qt-public-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('release/build_qt.py', 'ida-agent-plugin/cmake/qt_link_inputs.py', 'ida-agent-plugin/cmake/validate_ida_qt_*.py') }}
      - name: Build or validate public Qt link inputs
        run: python3 release/build_qt.py --prefix build/qt-public
      - name: Validate, compile and package
        env:
          IDASDK: ${{ github.workspace }}/ida-sdk/src
        run: |
          python3 release/build_linux.py \
            --qt-prefix build/qt-public
      - name: Verify release Gateway compatibility
        run: |
          python3 mcp-test-project/verify_stdio.py build/release/linux/ida-mcp
          python3 mcp-test-project/verify_compatibility.py build/release/linux/ida-mcp --http
      - name: Upload tested release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ida-agent-linux-x64-${{ github.sha }}
          path: |
            release/dist/ida-agent-*-linux-x64.tar.gz
            release/dist/ida-agent-*-linux-x64.tar.gz.sha256
            release/dist/ida-agent-*-linux-x64.deb
            release/dist/ida-agent-*-linux-x64.deb.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload CTest results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ida-agent-linux-package-tests-${{ github.sha }}
          path: build/release/linux/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14

  verify-deb:
    name: Debian package installation (${{ matrix.distribution }})
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        distribution: ['ubuntu:24.04', 'debian:13']
    container: ${{ matrix.distribution }}
    env:
      DEBIAN_FRONTEND: noninteractive
      IDA_AGENT_PACKAGE_TEST: '1'
    steps:
      - name: Install package validation tools
        run: |
          apt-get update
          apt-get install -y git ca-certificates python3 binutils desktop-file-utils appstream xvfb xauth passwd util-linux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ida-agent-linux-x64-${{ github.sha }}
          path: build/package-test
      - name: Verify checksum, installation and desktop integration
        run: |
          version=$(cat ida-mcp/VERSION)
          cd build/package-test
          sha256sum -c "ida-agent-$version-linux-x64.deb.sha256"
          cd ../..
          python3 release/tests/verify_linux_deb.py --install \
            --package "build/package-test/ida-agent-$version-linux-x64.deb"
